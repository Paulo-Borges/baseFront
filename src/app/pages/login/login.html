<div class="flex flex-col gap-4 items-center bg-gray-400 justify-center min-w-2xl h-full">
  <h2 class="font-semibold mt-4">Acessar o Sistema</h2>

  @if (error) {
    <div class="text-red-500" role="alert">
      {{ error }}
    </div>
  }

  <form (ngSubmit)="login()" class="flex flex-col p-4 gap-4 items-center justify-center w-full">
    <div class="flex flex-col gap-2 w-lg">
      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        [disabled]="isLoading"
        placeholder="seu.email@exemplo.com"
        required
        class="flex flex-col gap-2 w-full"
      />
    </div>

    <div class="flex flex-col gap-2 w-lg">
      <label for="password">Senha</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        [disabled]="isLoading"
        placeholder="••••••••"
        required
        class="flex flex-col gap-2 w-full"
      />
    </div>

    <button type="submit" [disabled]="isLoading">
      @if (isLoading) {
        <span class="bg-orange-300 px-3 py-1 rounded">Entrando...</span>
      } @else {
        <span class="bg-green-300 px-3 py-1 rounded">Entrar</span>
      }
    </button>
  </form>
</div>
